name: Build TurboIMS Next module
on:
  push:
    branches: ["feature/**", "fix/**", "master"]
    paths: ["root-runner/**", "module/**", "ci/**", "docs/KERNELSU_NEXT.md", "docs/ANDROID17_CARRIER_IMS_AUDIT.md", ".github/workflows/ksu-next.yml"]
  pull_request:
    paths: ["root-runner/**", "module/**", "ci/**", "docs/KERNELSU_NEXT.md", ".github/workflows/ksu-next.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ksu-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build with Android SDK ${{ matrix.compile_sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compile_sdk: [36, 37]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install Android SDK ${{ matrix.compile_sdk }}
        env:
          COMPILE_SDK: ${{ matrix.compile_sdk }}
        run: |
          if [ "$COMPILE_SDK" = "37" ]; then
            if ! sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"; then
              echo "::error::Android SDK 37 preview platform/build tools are not available from this runner's SDK repository."
              sdkmanager --list --channel=3 | grep -Ei 'android-37|Cinnamon|build-tools;37' || true
              exit 1
            fi
          else
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Validate module scripts, packaging guards and offline WebUI
        run: |
          shellcheck -S warning -e SC2154 module/*.sh
          for script in module/*.sh; do bash -n "$script"; done
          node --check module/webroot/app.js
          node --test ci/test_webui.cjs
          python3 -m unittest discover -s ci -p 'test_package_module.py' -v
      - name: Build and test standalone root runner
        env:
          COMPILE_SDK: ${{ matrix.compile_sdk }}
        run: ./gradlew -p root-runner --no-daemon -PandroidCompileSdk="$COMPILE_SDK" -PandroidBuildToolsVersion="$COMPILE_SDK.0.0" testReleaseUnitTest assembleRelease
      - name: Package flat module payload and canonical ZIP
        id: package
        env:
          TURBOIMS_COMPILE_SDK: ${{ matrix.compile_sdk }}
        run: python3 ci/package_module.py
      - name: Upload directly flashable ZIP contents
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/flashable/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
      - name: Summarize Java test results
        if: always()
        run: python3 ci/summarize_tests.py
  verify-download:
    name: Verify downloadable ZIP (SDK ${{ matrix.compile_sdk }})
    if: always()
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compile_sdk: [36, 37]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install BusyBox for installer smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox
      - name: Download this run's matching SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TURBOIMS_ARTIFACT_SUFFIX: -sdk${{ matrix.compile_sdk }}
        run: |
          artifacts=$(gh api "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          artifact_name=$(printf '%s' "$artifacts" | jq -r --arg suffix "$TURBOIMS_ARTIFACT_SUFFIX" '[.artifacts[] | select(.name | endswith($suffix))] | sort_by(.created_at) | last | .name // empty')
          artifact_id=$(printf '%s' "$artifacts" | jq -r --arg suffix "$TURBOIMS_ARTIFACT_SUFFIX" '[.artifacts[] | select(.name | endswith($suffix))] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
            echo "::error::No uploaded artifact found for SDK ${{ matrix.compile_sdk }}."
            exit 1
          fi
          echo "TURBOIMS_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          gh api "repos/${GH_REPO}/actions/artifacts/${artifact_id}/zip" > "$RUNNER_TEMP/turboims-downloaded.zip"
      - name: Validate actual archive and run installation smoke
        run: |
          python3 ci/verify_module.py "$RUNNER_TEMP/turboims-downloaded.zip"
          python3 ci/smoke_install.py "$RUNNER_TEMP/turboims-downloaded.zip"
          python3 ci/summarize_download.py "$RUNNER_TEMP/turboims-downloaded.zip"
