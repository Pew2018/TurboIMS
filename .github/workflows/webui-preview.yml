name: Preview WebUI startup and operation progress
on:
  push:
    branches: ["feature/md-indeterminate-progress", "master"]
    paths: ["module/webroot/**", "ci/**", ".github/workflows/webui-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chinese preview font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install remote browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Capture and validate mobile UI
        run: |
          python3 -m http.server 8765 --directory module/webroot > "$RUNNER_TEMP/webui-server.log" 2>&1 &
          node ci/ui_polish_preview.cjs
          node ci/task_progress_preview.cjs
          node ci/startup_preview.cjs
      - name: Upload screenshots and contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboims-webui-preview
          path: preview/
          if-no-files-found: error
