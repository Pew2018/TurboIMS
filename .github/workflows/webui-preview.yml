name: Preview OnePlus WebUI
on:
  push:
    branches: ["feature/oneplus-webui", "feature/sim-preference-editors-accent-scope", "feature/webui-ux-cleanup"]
    paths: ["module/webroot/**", "ci/webui_preview.cjs", ".github/workflows/webui-preview.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install Chinese preview font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install remote browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Capture mobile UI
        run: |
          python3 -m http.server 8765 --directory module/webroot > "$RUNNER_TEMP/webui-server.log" 2>&1 &
          node ci/webui_preview.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneplus-webui-preview
          path: preview/
          if-no-files-found: error
